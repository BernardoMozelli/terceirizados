server {
    listen 80;
    server_name localhost;

    # Define a raiz para os arquivos estáticos do frontend
    root /usr/share/nginx/html;
    index index.html;

    # Tenta servir o arquivo solicitado. Se não encontrar, retorna o index.html
    # Isso é crucial para Single Page Applications (SPAs) com roteamento no lado do cliente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redireciona todas as chamadas de API para o serviço de backend.
    # A lista de locais é baseada nas rotas (blueprints) da sua aplicação Flask.
    location ~ ^/(auth|usuarios|empresas|funcionarios|confirmacoes_status|logs_atividades|dashboard|importar|secretarias|transferencias|configuracoes|run-daily-tasks) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
