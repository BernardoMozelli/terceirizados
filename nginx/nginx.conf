server {
    listen 80;
    server_name localhost;
    client_max_body_size 20M;

    # --- AJUSTE 1: Proxy para a API ---
    # Usamos o símbolo '~' para indicar Regex. 
    # Isso captura qualquer uma dessas palavras no início da URL.
    #location ~ ^/(auth|usuarios|empresas|funcionarios|confirmacoes_status|logs_atividades|dashboard|importar|secretarias|transferencias|configuracoes|run-daily-tasks) {
    location /api/ {    
        # REMOVIDA a barra '/' do final. 
        # Agora, se o Nginx recebe /auth/login, ele entrega /auth/login ao Flask.
        proxy_pass http://pmsl_backend:5000; 

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Evita redirecionamentos automáticos que quebram o POST
        proxy_redirect off;
    }

    # 2. Rota de Imagens Estáticas
    location /static/uploads/ {
        proxy_pass http://pmsl_backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Frontend (Com ajuste de Cache para sincronização automática)
    location / {
        root /usr/share/nginx/html;
        index index.html;

        # Estes comandos ajudam a ver as alterações do Frontend na hora:
        sendfile off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";

        try_files $uri $uri/ /index.html;
    }

    # 4. Bloqueio de arquivos sensíveis
    location ~ /\.ht {
        deny all;
    }
}
