<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Secretarias - PMSL Terceiros</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  
  <link id="themeStylesheet" href="css/theme.css" rel="stylesheet" />
  <link href="css/config.css" rel="stylesheet" />
  <link href="css/internal-pages.css" rel="stylesheet" />
  <link href="themes/tema-escuro.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="css/pmsl-moderno.css" rel="stylesheet" />
  </head>

<body>
  <div id="navbar-placeholder"></div>

  <div class="container my-4">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0 fw-bold">
                <i class="fas fa-sitemap me-2 icon-blue"></i> Secretarias
            </h2>
            <br>
            <p class="text-muted mb-0">Organização das unidades administrativas e alocação de pessoal.</p>
        </div>

        <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCriarSecretaria" data-permission="criar_secretaria">
            <i class="fas fa-plus me-2"></i>Nova Secretaria
        </button>
    </div>
    
    <hr class="mt-0 mb-4 opacity-10">

    <div class="card border-0 shadow-sm">
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0" id="secretariasTable">
          <thead class="table-light">
            <tr>
              <th style="width: 80px;">ID</th>
              <th>Nome</th>
              <th class="text-center" style="width: 150px;">Ações</th>
            </tr>
          </thead>
          <tbody>
            </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalCriarSecretaria" tabindex="-1" aria-labelledby="modalCriarSecretariaLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="createSecretariaForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalCriarSecretariaLabel">Cadastrar Secretaria</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="nome" class="form-label">Nome da Secretaria</label>
              <input type="text" id="nome" name="nome" class="form-control" placeholder="Ex: Secretaria de Saúde" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save me-2"></i>Salvar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="modalEditarSecretaria" tabindex="-1" aria-labelledby="modalEditarSecretariaLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="editSecretariaForm">
          <div class="modal-header">
            <h5 class="modal-title" id="modalEditarSecretariaLabel">Editar Secretaria</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editSecretariaId" name="id" />
            <div class="mb-3">
              <label for="editNome" class="form-label">Nome da Secretaria</label>
              <input type="text" id="editNome" name="nome" class="form-control" required />
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">
              <i class="fas fa-save me-2"></i>Salvar Alterações
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/secretarias.js"></script>
</body>

</html>
