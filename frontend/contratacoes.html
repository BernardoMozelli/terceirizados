<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contratações - PMSL Terceirizados</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/theme.css" />
    <link href="css/internal-pages.css" rel="stylesheet" />
    <link href="themes/tema-escuro.css" rel="stylesheet" />
    <link href="css/pmsl-moderno.css" rel="stylesheet" />
  </head>
<body>
    <div id="navbar-placeholder"></div>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2><i class="fas fa-briefcase me-2 icon-blue"></i> Contratações</h2>
                <p class="text-muted mb-0">Cadastrar novo candidato para contratação</p>
            </div>
        </div>
        <hr class="mt-0 mb-4 opacity-10">

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <form id="formContratacao">
                    <div class="row g-3">
                        <div class="col-12 text-center mb-4">
                            <div id="preview-foto" class="mb-3" style="display: none;">
                                <img id="preview-img" src="" alt="Preview" style="max-width: 150px; max-height: 150px; border-radius: 8px; border: 2px solid #007bff;">
                            </div>
                            <div>
                                <label for="criar-foto" class="btn btn-outline-primary fw-bold shadow-sm" style="width: 310px;">
                                    <i class="fas fa-upload me-2"></i>Inserir foto do candidato
                                </label>
                                <input type="file" id="criar-foto" class="d-none" accept="image/png, image/jpeg, image/jpg" onchange="previewImagem(this)">
                                <small class="text-muted mt-2 d-block">Formatos: JPG/PNG. Máx: 2MB.</small>
                            </div>
                        </div>

                        <div class="col-12">
                            <h5 class="text-primary mb-4 border-bottom pb-2 fw-bold">
                                <i class="fas fa-id-card me-2"></i> Dados Pessoais
                            </h5>
                            
                            <div class="row g-3 mb-4">
                                <div class="col-12">
                                    <label class="form-label">Nome Completo <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="criar-nome" required>
                                </div>
                                <div class="col-12 col-md-7">
                                    <label class="form-label">Email <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="criar-email" required>
                                </div>
                                <div class="col-12 col-md-5">
                                    <label class="form-label">CPF <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="criar-cpf" placeholder="000.000.000-00" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Telefone <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="criar-telefone" placeholder="(00) 00000-0000" required>
                                </div>
                                <div class="col-12" data-indicacao>
                                    <label class="form-label">Indicação <span class="text-danger">*</span></label>
                                    <textarea class="form-control" id="indicacao" style="height: auto !important; min-height: 100px;" placeholder="Quem indicou esse candidato." required></textarea>
                                </div>
                            </div>

                            <h5 class="text-primary mb-4 border-bottom pb-2 fw-bold mt-4">
                                <i class="fas fa-briefcase me-2"></i> Dados Profissionais
                            </h5>
                            
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label">Cargo <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="criar-cargo" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label">Setor de Atuação <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="criar-setor" placeholder="Ex: Financeiro, TI, RH..." required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label">Empresa <span class="text-danger">*</span></label>
                                    <select class="form-select" id="criar-empresa" required></select>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label">Secretaria <span class="text-danger">*</span></label>
                                    <select class="form-select" id="criar-secretaria" required></select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">Data de Início Prevista <span class="text-danger">*</span></label>
                                    <input type="date" class="form-control" id="criar-data-inicio" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-success fw-bold shadow-sm">
                            <i class="fas fa-save me-2"></i>Salvar Candidato
                        </button>
                        <button type="reset" class="btn btn-secondary fw-bold shadow-sm">
                            <i class="fas fa-redo me-2"></i>Limpar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/layout.js"></script>
    <script src="js/contratacoes_form.js"></script>
</body>
</html>
