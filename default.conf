server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Arquivos estáticos (html, css, js, imagens, etc.)
    location ~ \.(html|css|js|png|jpg|jpeg|gif|ico)$ {
        try_files $uri =404;
    }

    # Roteamento SPA (só se acessar rota que não tem arquivo físico)
   # location / {
   #     try_files $uri /index.html;
    #}

    # Proxy para backend Flask
    location ~ ^/(auth|usuarios|empresas|funcionarios|confirmacoes_status|logs_atividades|dashboard|importar|secretarias|transferencias|configuracoes|run-daily-tasks) {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }
   # O Nginx repassa a requisicao de imagens para o container do Python
    location /static/uploads/ {
        proxy_pass http://backend:5000; # Nome do serviço no docker-compose
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

}
