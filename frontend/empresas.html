<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Empresas - PMSL Terceiros</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
  
  <link id="themeStylesheet" href="css/theme.css" rel="stylesheet" />
  <link href="css/config.css" rel="stylesheet" />
  <link href="css/internal-pages.css" rel="stylesheet" />
  <link href="themes/tema-escuro.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="css/pmsl-moderno.css" rel="stylesheet" />
  </head>

<body>
  <div id="navbar-placeholder"></div>

  <div class="container my-4">
    
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h2 class="mb-0 fw-bold">
                <i class="fas fa-building me-2 text-primary"></i> Empresas
            </h2>
            <p class="text-muted mb-0">Gerenciar empresas parceiras.</p>
        </div>

        <button class="btn btn-primary shadow-sm" data-bs-toggle="modal" data-bs-target="#modalCriarEmpresa" data-permission="criar_empresa">
            <i class="fas fa-plus me-2"></i>Nova Empresa
        </button>
    </div>
    
    <hr class="mt-0 mb-4 opacity-10">

    <div class="table-responsive shadow-sm rounded">
      <table class="table table-striped align-middle" id="empresasTable">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>CNPJ</th>
            <th>Endereço</th>
            <th>Telefone</th>
            <th>E-mail</th>
            <th class="text-center">Ações</th>
          </tr>
        </thead>
        <tbody>
          </tbody>
      </table>
    </div>

    <nav aria-label="Navegação" id="paginationContainer" class="mt-3"></nav>
  </div>

  <div class="modal fade" id="modalEditarEmpresa" tabindex="-1" aria-labelledby="modalEditarEmpresaLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <form id="editEmpresaForm">
            <div class="modal-header border-bottom py-3">
              <h5 class="modal-title d-flex align-items-center fw-bold" id="modalEditarEmpresaLabel">
                <i class="fas fa-pen me-2 text-primary"></i> Editar Empresa
              </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            
            <div class="modal-body p-4">
              <input type="hidden" id="editEmpresaId">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="editCnpj" class="form-label fw-bold small text-muted text-uppercase">CNPJ <span class="text-danger">*</span></label>
                  <input type="text" id="editCnpj" name="cnpj" class="form-control shadow-sm" maxlength="18" required />
                </div>
                <div class="col-md-6">
                  <label for="editNome" class="form-label fw-bold small text-muted text-uppercase">Razão Social <span class="text-danger">*</span></label>
                  <input type="text" id="editNome" name="nome" class="form-control shadow-sm" required />
                </div>
                <div class="col-md-12">
                  <label for="editEndereco" class="form-label fw-bold small text-muted text-uppercase">Endereço Completo <span class="text-danger">*</span></label>
                  <input type="text" id="editEndereco" name="endereco" class="form-control shadow-sm" required />
                </div>
                <div class="col-md-6">
                  <label for="editTelefone" class="form-label fw-bold small text-muted text-uppercase">Telefone de Contato</label>
                  <input type="text" id="editTelefone" name="telefone" class="form-control shadow-sm" />
                </div>
                <div class="col-md-6">
                  <label for="editEmail" class="form-label fw-bold small text-muted text-uppercase">E-mail Corporativo</label>
                  <input type="email" id="editEmail" name="email" class="form-control shadow-sm" />
                </div>
              </div>
            </div>
            
            <div class="modal-footer border-top d-flex justify-content-between py-3 px-4">
              <button type="button" class="btn btn-secondary shadow-sm px-4" data-bs-dismiss="modal">Cancelar</button>
              <button type="submit" class="btn btn-success shadow-sm px-4"><i class="fas fa-save me-2"></i>Salvar Alterações</button>
            </div>
          </form>
        </div>
      </div>
  </div>

  <div class="modal fade" id="modalCriarEmpresa" tabindex="-1" aria-labelledby="modalCriarEmpresaLabel" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
          <form id="createEmpresaForm">
            <div class="modal-header border-bottom py-3">
              <h5 class="modal-title d-flex align-items-center fw-bold" id="modalCriarEmpresaLabel">
                <i class="fas fa-building me-2 text-primary"></i> Dados da Nova Empresa
              </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
            </div>
            
            <div class="modal-body p-4">
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="cnpj" class="form-label fw-bold small text-muted text-uppercase">CNPJ <span class="text-danger">*</span></label>
                  <input type="text" id="cnpj" name="cnpj" class="form-control shadow-sm" maxlength="18" required />
                </div>
                <div class="col-md-6">
                  <label for="nome" class="form-label fw-bold small text-muted text-uppercase">Razão Social <span class="text-danger">*</span></label>
                  <input type="text" id="nome" name="nome" class="form-control shadow-sm" required />
                </div>
                <div class="col-md-12">
                  <label for="endereco" class="form-label fw-bold small text-muted text-uppercase">Endereço Completo <span class="text-danger">*</span></label>
                  <input type="text" id="endereco" name="endereco" class="form-control shadow-sm" required />
                </div>
                <div class="col-md-6">
                  <label for="telefone" class="form-label fw-bold small text-muted text-uppercase">Telefone de Contato</label>
                  <input type="text" id="telefone" name="telefone" class="form-control shadow-sm" />
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label fw-bold small text-muted text-uppercase">E-mail Corporativo</label>
                  <input type="email" id="email" name="email" class="form-control shadow-sm" />
                </div>
              </div>
            </div>
            
            <div class="modal-footer border-top d-flex justify-content-between py-3 px-4">
              <button type="button" class="btn btn-outline-secondary px-4 shadow-sm" id="btnLimparEmpresa">
                <i class="fas fa-eraser me-2"></i>Limpar
              </button>
              
              <div>
                <button type="button" class="btn btn-secondary shadow-sm px-4 me-2" data-bs-dismiss="modal">Cancelar</button>
                <button type="submit" class="btn btn-success shadow-sm px-4"><i class="fas fa-save me-2"></i>Salvar Empresa</button>
              </div>
            </div>
          </form>
        </div>
      </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/cnpj-autocomplete.js"></script>
  <script src="js/empresas.js"></script>

</body>
</html>
